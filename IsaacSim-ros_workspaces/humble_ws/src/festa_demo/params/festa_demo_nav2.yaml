controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 10.0   # festa_demo: Pi load 6.6-11.6 / 4 cores (2026-10-01 R2, R13); was 20
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    # festa_demo: festa_demo.xml uses only FollowPath + general_goal_checker; the reverse
    # controller and return_goal_checker (PlaceOnCommand return leg) were dropped (2026-10-01).
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      # festa_demo (2026-10-02, sim S25_V4): pose checker - turning in place counts as progress,
      # so the allowance can be short again. 0.5 m in 25 s took 92 s wall per check in sim while
      # the robot was wedged against the inner corner (6 checks before the first Spin).
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.25
      required_movement_angle: 0.5
      # was 10.0 -> raised to 25.0: SimpleProgressChecker only counts translational
      # movement, but the FollowPath "RotateToGoal" critic intentionally zeroes linear
      # velocity to rotate in place once the robot is within xy_goal_tolerance of a
      # goal. Sim log showed a spot-goal FollowPath failing with "Failed to make
      # progress" after 33s (not immediately at 10s), consistent with the robot
      # actually reaching the goal area then stalling during the rotate-in-place
      # alignment phase and getting killed by this timer before it could finish.
      movement_time_allowance: 10.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # was 0.25 -> loosened to 0.35: spot-goal legs (e.g. Leg 1) kept hitting
      # "Failed to make progress" within centimeters of the goal (observed:
      # robot sat 0.257m away, just outside the old 0.25 tolerance) - the
      # final approach near a tight/obstacle-adjacent spot couldn't quite
      # close that last gap before the progress checker gave up.
      xy_goal_tolerance: 0.5
      # was 0.25 (nav2 default; still what the commented-out precise_goal_checker
      # above uses) -> tightened to 0.05: with xy loosened above, the robot
      # was satisfying "close enough" and stopping well before its final yaw
      # matched the commanded one. xy_goal_tolerance was the actual cause of
      # the old stalls (translation-only progress checker vs RotateToGoal),
      # not yaw, so tightening yaw alone shouldn't reintroduce that failure.
      yaw_goal_tolerance: 0.5
    # DWB parameters
    FollowPath:
      # festa_demo: Nav2's rotation shim in front of the same DWB settings. When
      # the path starts more than 45 deg off the robot's heading (the start of
      # each leg: the way back begins with a 180 deg turn), the robot turns in
      # place first; DWB alone turned in wide forward arcs and drove into the
      # corner obstacle / wall stub (sim N3, D1, D2).
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "dwb_core::DWBLocalPlanner"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.8
      max_angular_accel: 3.2
      simulate_ahead_time: 1.0
      debug_trajectory_details: False   # festa_demo: Pi load 13 / 4 cores, 2026-10-01; was True
      min_vel_x: 0.0
      min_vel_y: 0.0
      # festa_demo (2026-10-02, real R22): 0.26 m/s while turning asked the outer wheel for ~0.34 m/s;
      # it could not, and the (then open-loop) odometry counted 122 deg too much. v + w*0.1435 <= ~0.22.
      max_vel_x: 0.15
      max_vel_y: 0.0
      max_vel_theta: 0.5
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      # Add high threshold velocity for turtlebot 3 issue.
      # https://github.com/ROBOTIS-GIT/turtlebot3_simulations/issues/75
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 10   # festa_demo: Pi load 13 / 4 cores, 2026-10-01; was 20
      vy_samples: 5
      vtheta_samples: 15   # festa_demo: Pi load 13 / 4 cores, 2026-10-01; was 20
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5   # festa_demo: was 0.2 (Pi TF lag)
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.25
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      # was 5.0 -> lowered to 1.5: robot kept getting VERY close to the goal
      # yaw (within a few cm / single-digit-to-teens degrees) but never
      # closing the last bit before "Failed to make progress" - consistent
      # with a high slowing_factor decelerating angular velocity so
      # aggressively near the target that the final approach asymptotes
      # instead of completing within the time window.
      RotateToGoal.slowing_factor: 1.5
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      # festa_demo: on the robot's Pi the TF chain lagged 0.6-1.6 s behind
      # (2026-10-01). The controller's goal check transforms the goal with the
      # local costmap's tolerance (default 0.3 s); when that failed, Nav2 Humble
      # compared the robot with an empty pose at the odom origin - where the
      # robot started - and reported "Reached the goal!" after 2 s.
      transform_tolerance: 1.0
      update_frequency: 3.0   # festa_demo: Pi load 6.6-11.6 / 4 cores (2026-10-01 R2, R13); was 5
      publish_frequency: 1.0   # was 2
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: True
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.20   # festa_demo: user, obstacle margin too wide (2026-10-01); was 0.22
      # festa_demo: 2D lidar only, a voxel grid adds nothing (Pi load 13 / 4 cores, 2026-10-01); was voxel_layer
      # festa_demo (2026-10-02, sim S25_V4): + static_layer. With lidar only, the wall corner
      # inside the 0.20 m footprint circle was cleared from the local costmap (footprint
      # clearing) and DWB drove the robot onto the inner corner of the L at 0.26 m/s.
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0   # festa_demo: user 2026-10-02 (after real R38d, with inflation 0.15); was 8.0, 5.0, 3.0
        inflation_radius: 0.20   # festa_demo: user 2026-10-02 (after real R38d) = robot_radius; was 0.25, 0.3, originally 0.55
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: False   # festa_demo: Pi load 13 / 4 cores, 2026-10-01; was True

global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 1.0   # festa_demo: see local_costmap
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: True
      robot_radius: 0.20   # festa_demo: user, obstacle margin too wide (2026-10-01); was 0.22
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0   # festa_demo: user 2026-10-02 (after real R38d, with inflation 0.15); was 8.0, 5.0, 3.0
        inflation_radius: 0.20   # festa_demo: user 2026-10-02 (after real R38d) = robot_radius; was 0.28, 0.35, originally 0.55
      always_send_full_costmap: False   # festa_demo: Pi load 13 / 4 cores, 2026-10-01; was True

