velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 10.0   # festa_demo: Pi load 6.6-11.6 / 4 cores (2026-10-01 R2, R13); was 20
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 0.5]   # festa_demo (real R22): wheel limit, see FollowPath
    min_velocity: [-0.15, 0.0, -0.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
