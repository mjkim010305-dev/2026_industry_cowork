# festa_demo Nav2 params: derives from L_corridor_nav2.yaml (origin/main 23e4745,
# collaborator) via festa_bringup/params/l_course_nav2.yaml. plugin_lib_names below
# drops every custom_* BT plugin library (custom_nav2_bt_plugins, not part of this
# self-contained package) and adds the four festa_demo_* ones instead.
# festa_demo.launch.py rewrites default_nav_to_pose_bt_xml to the installed
# bt/festa_demo.xml and use_sim_time per mode, so the absolute paths below are
# never used as-is.
amcl:
  ros__parameters:
    use_sim_time: True
    # was 0.2 / 0.2 / 0.2 / 0.2 -> lowered to 0.1: AMCL covariance was observed growing
    # (not shrinking) across samples; 0.2 overestimates odom motion noise given the sim
    # bridge's odom is fairly accurate, so particles were spreading faster than the
    # (already weak, see max_beams below) laser correction could pull them back in.
    # festa_demo (2026-10-02, real R22): alpha1 (rotation noise from rotation) 0.1 -> 0.25.
    # Turning against the box, the wheels slipped and odometry counted 173 deg for a 46 deg
    # turn; with 0.1 the particles followed odometry and AMCL ended ~1 m / 96 deg off.
    alpha1: 0.25
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    # was 0.2 -> lowered to 0.05: same reasoning as alpha1-4, applied to the
    # rotation-induced translation noise term specifically.
    alpha5: 0.05
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    # was 60 -> raised to 200: /scan has a ~155 degree (~45% of 1066 beams) contiguous
    # invalid/blind arc (range -1.0, roughly behind the robot). AMCL subsamples
    # max_beams evenly across the full scan, so most of the 60 picked beams were
    # landing in the blind arc and contributing no real correction information.
    # Raising the count compensates so enough beams still land in the valid ~205 degrees.
    max_beams: 100   # festa_demo: Pi load 13 / 4 cores, 2026-10-01 (x1000 particles); was 200
    max_particles: 1000  # festa_demo: 500 (Pi load, R2/R13) let AMCL collapse in R17; was 2000
    min_particles: 200   # was 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    # was 0.0 / 0.0 -> enabled Augmented MCL recovery (fast 0.1, slow 0.001): with both
    # at 0.0, AMCL has no mechanism to inject random particles when average likelihood
    # drops, so once the filter starts diverging (as observed: covariance climbing
    # across two consecutive /amcl_pose samples) it has no way to recover on its own.
    # festa_demo (R17, 2026-10-01): random injection teleported the pose 1-2 m on the
    # real robot (Pi load starves the filter); back to 0.0 / 0.0.
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    # was 0.2 rad (~11.5 deg) / 0.25 m -> lowered to 0.1 / 0.1: with alpha1-5 causing
    # particle spread between updates, correcting more frequently (smaller motion
    # thresholds before AMCL re-runs the laser update) limits how far particles can
    # drift apart before being pulled back in.
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

